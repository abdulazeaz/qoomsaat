name: JiraWorklog
options:
  deploymentTarget:
    macOS: "14.0"
configFiles:                        # Team and BUNDLE_ID_PREFIX: see Config.xcconfig / Local.xcconfig
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  JiraWorklog:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: JiraWorklogWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).JiraWorklog
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jira Worklog
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        AppGroupID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).jiraworklog
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).jiraworklog]

  JiraWorklogWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).JiraWorklog.Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Jira Worklog
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).jiraworklog
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).jiraworklog]
